[workspace]
resolver = "2"
members = [
    "protoc-gen-rosetta-rpc",
    "rust-runtime",
    "example/rust/protobuf-gen",
    "example/rust/game",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/acamadeo/godot-rosetta-rpc"

# Centralized dependencies used across the project crates
[workspace.dependencies]
prost = "0.14"
prost-types = "0.14"
godot = "0.5.4"
